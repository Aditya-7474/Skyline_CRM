spring.application.name=skyline-real-estate-crm
server.port=${PORT:8001}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/skyline_crm?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
app.jwt.secret=${JWT_SECRET:f2123011546da83f6d8a2b72a1b23bbe5090831718172114f5c50d07f351061f28ceed8c2330cbb7c18c95bbcbf7851e}
app.jwt.algorithm=${JWT_ALGORITHM:HS256}
app.jwt.expiration-minutes=${ACCESS_TOKEN_MINUTES:1440}
app.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
spring.jackson.default-property-inclusion=non_null
